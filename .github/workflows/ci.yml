name: Venda.AI CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Z-API adapter tests
        run: node --test tests/zapi-adapter.test.mjs
      - name: Run Z-API webhook tests
        run: node --test tests/zapi-webhook.test.mjs
      - run: npm audit --audit-level=high
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test wait-on
          npx playwright install --with-deps chromium
      - name: Run functional browser QA
        run: |
          npm run dev -- --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:5173
          npx playwright test tests/core.spec.js
